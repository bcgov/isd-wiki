apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "isd-wiki.fullname" . }}-html
  labels:
    {{- include "isd-wiki.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      # dig keeps this safe for the existing "helm upgrade --reuse-values"
      # deploys, whose stored values predate the persistence block.
      storage: {{ dig "persistence" "html" "size" "5Gi" .Values.mediawiki }}
