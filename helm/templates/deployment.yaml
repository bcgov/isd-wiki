apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "isd-wiki.fullname" . }}
  labels:
    {{- include "isd-wiki.labels" . | nindent 4 }}
spec:
  {{- if not .Values.mediawiki.autoscaling.enabled }}
  replicas: {{ .Values.mediawiki.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "isd-wiki.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # 1. Vault injector configuration
        vault.hashicorp.com/agent-inject: 'true'
        # set to 'true' if you are going to connect and query vault from your application
        vault.hashicorp.com/agent-inject-token: 'false'
        # this makes sure the secret vault will only change during pod restart
        vault.hashicorp.com/agent-pre-populate-only: 'true'
        # Must match cluster. Use one of: k8s-silver, k8s-gold, k8s-golddr, k8s-emerald
        vault.hashicorp.com/auth-path: auth/k8s-{{ .Values.global.cluster }}
        vault.hashicorp.com/namespace: platform-services
        # licenseplate-nonprod or licenseplate-prod are your options
        vault.hashicorp.com/role: {{ .Values.global.vault.role }}
        # - The value is the path in Vault where the secret is located.
        vault.hashicorp.com/agent-inject-secret-isd-db-user: {{ .Values.global.licenseplate }}-{{ .Values.global.vault.engine }}/{{ .Values.global.vault.secret }}
        # - The template Vault Agent should use for rendering a secret:
        vault.hashicorp.com/agent-inject-template-secrets: |
          {{`{{- with secret `}}"{{ .Values.global.licenseplate }}-{{ .Values.global.vault.engine }}/{{ .Values.global.vault.secret }}"{{` }}
          {{- range $k, $v := .Data.data }}
          {{ $k }}={{ $v }}{{ end -}}
          {{- end `}} }}
      {{- with .Values.mediawiki.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "isd-wiki.labels" . | nindent 8 }}
        {{- include "isd-wiki.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.mediawiki.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.global.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.mediawiki.podSecurityContext | nindent 8 }}
      initContainers:
       - name: copy-mediawiki-files
         image: "{{ .Values.mediawiki.image.repository }}:{{ .Values.mediawiki.image.tag }}"
         command: ["/bin/sh", "-c"]
         args:
          # The official MediaWiki image has the files in /var/www/html.
          # We copy them from that location into a different, temporary mount point for the volume.
          #
          # cp merges without deleting, so a file that upstream removes or
          # renames survives on the volume forever. PageForms REL1_46 renames
          # every PF_*.php file (82 of them), which would otherwise leave a
          # full stale copy of the extension alongside the new one on a volume
          # that is already tight on space. Clearing the directory first keeps
          # the extension tree matching the image. This is safe because
          # PageForms is entirely image-provided - no uploads, LocalSettings.php
          # or other volume-resident state lives under it.
          - "rm -rf /copy-dest/extensions/PageForms && cp -r /var/www/html/. /copy-dest/"
         volumeMounts:
          - name: mediawiki-html-volume
            mountPath: /copy-dest

      containers:
       - name: nginx
         securityContext:
            {{- toYaml .Values.nginx.securityContext | nindent 12 }}
         image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag | default .Chart.AppVersion }}"
         imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
         resources:
          {{- toYaml .Values.nginx.resources | nindent 12 }}
         volumeMounts:
          - name: empty-dir
            mountPath: /tmp
            subPath: tmp-dir
          - name: nginx-run
            mountPath: /var/run
          - name: nginx-config
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: nginx.conf
          # - name: certificate
          #   mountPath: /certs
          - name: nginx-cache
            mountPath: /var/cache/nginx
          # The NGINX server will read the PHP files from this shared volume
          - name: mediawiki-html-volume
            mountPath: /var/www/html
         env:
            - name: PHP_FPM_HOST
              value: localhost
            - name: PHP_FPM_PORT
              value: "9000"
         ports:
            - name: health-check
              containerPort: 8080
              protocol: TCP
            - name: proxy-traffic
              containerPort: 443
              protocol: TCP
            - name: http-app
              containerPort: 8080
              protocol: TCP
            - name: https-app
              containerPort: 8081
              protocol: TCP
         livenessProbe:
            httpGet:
              path: /health
              port: health-check
            initialDelaySeconds: 30
            periodSeconds: 10
         readinessProbe:
            httpGet:
              path: /health
              port: health-check
            initialDelaySeconds: 30
            periodSeconds: 10

        # The main MediaWiki PHP-FPM container
       - name: mediawiki
         securityContext:
           {{- toYaml .Values.mediawiki.securityContext | nindent 16 }}
         image: "{{ .Values.mediawiki.image.repository }}:{{ .Values.mediawiki.image.tag }}"
         imagePullPolicy: {{ .Values.mediawiki.image.pullPolicy }}
         ports:
          - name: fpm
            containerPort: 9000
            protocol: TCP
         #  command: ["/usr/local/sbin/php-fpm", "-F"]
         args: ["php-fpm", "-F"]
         env:
            - name: MEDIAWIKI_DB_TYPE
              value: {{ .Values.mediawiki.database.type | quote }}
            - name: MEDIAWIKI_DB_HOST
              value: {{ .Values.mediawiki.database.host | default (printf "%s-mysql" (include "isd-wiki.fullname" .)) | quote }}
            - name: MEDIAWIKI_DB_PORT
              value: {{ .Values.mediawiki.database.port | default 5432 | quote }}
            - name: MEDIAWIKI_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mediawiki.database.secretName | quote }}
                  key: app-db-name
            - name: MEDIAWIKI_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mediawiki.database.secretName | quote }}
                  key: app-db-username
            - name: MEDIAWIKI_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mediawiki.database.secretName | quote }}
                  key: app-db-password
            - name: MEDIAWIKI_SITE_NAME
              value: {{ .Values.mediawiki.siteName | quote }}
            - name: MEDIAWIKI_SITE_SERVER
              value: {{ .Values.mediawiki.siteServer | quote }}
            - name: MEDIAWIKI_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "isd-wiki.fullname" . }}-credentials
                  key: admin-user
            - name: MEDIAWIKI_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "isd-wiki.fullname" . }}-credentials
                  key: admin-password
            - name: MEDIAWIKI_SMTP_HOST
              value: {{ .Values.mediawiki.smtp.host | quote }}
            - name: MEDIAWIKI_SMTP_ID_HOST
              value: {{ .Values.mediawiki.smtp.idHost | quote }}
            - name: MEDIAWIKI_SMTP_LOCALHOST
              value: {{ .Values.mediawiki.smtp.localhost | quote }}
            - name: MEDIAWIKI_SMTP_PORT
              value: {{ .Values.mediawiki.smtp.port | quote }}
            - name: MEDIAWIKI_SMTP_AUTH
              value: {{ .Values.mediawiki.smtp.auth | quote }}
         volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
            - name: mediawiki-html-volume
              mountPath: /var/www/html
            - name: mediawiki-data
              mountPath: /var/www/data
         # An explicitly-set mediawiki.resources always wins. An empty map falls
         # back to the defaults below rather than rendering nothing.
         #
         # This matters because both environments were installed with
         # "mediawiki.resources: {}" recorded in their stored values, and they
         # are upgraded with --reuse-values. Stored values take precedence over
         # chart defaults, so raising the default in values.yaml alone would be
         # silently ignored on every existing release - it would only ever apply
         # to a fresh install.
         resources:
            {{- if .Values.mediawiki.resources }}
            {{- toYaml .Values.mediawiki.resources | nindent 12 }}
            {{- else }}
            requests:
              # The namespace LimitRange injects 256Mi when nothing is set,
              # which is roughly the container's idle footprint and well under
              # what it actually uses serving traffic: ~200Mi baseline (opcache
              # 128M + APCu 32M + master) plus up to pm.max_children (16) PHP
              # workers. Requesting 768Mi makes the scheduler account for real
              # usage, and keeps the pod from being an early eviction candidate
              # under node memory pressure, where Burstable pods are ranked by
              # how far usage exceeds requests.
              #
              # Sized so it still holds at replicaCount 2, the eventual target
              # for surviving node drains. Per pod that is 832Mi (768 here plus
              # nginx's 64Mi) and 150m; two pods put prod at 2560Mi of its 4Gi
              # requests.memory quota and 460m of 2 cores, alongside the 3-node
              # Patroni cluster. This is a per-pod working set, so the number
              # does not change when the second replica arrives.
              cpu: 100m
              memory: 768Mi
            limits:
              # Same 4Gi the LimitRange already applies - stated explicitly so
              # it is visible rather than inherited. Worst case is bounded by
              # pm.max_children * PHP memory_limit (16 * 128M = 2Gi), so this
              # leaves headroom without inviting an OOM kill. Raising PHP's
              # memory_limit to 256M would put worst case at 4Gi, exactly at
              # this ceiling - do not raise one without the other.
              memory: 4Gi
              # Deliberately no CPU limit. The container is CPU-light (~4m
              # observed) and bursty under page renders; a low ceiling would
              # throttle request latency for no memory-safety benefit.
            {{- end }}
         readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
         livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10

      volumes:
        - name: empty-dir
          emptyDir: {}
        - name: tmp-dir
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        # - name: certificate
        #   secret:
        #     secretName: proxy-nginx-tls
        #     items:
        #       - key: tls.crt
        #         path: server.crt
        #       - key: tls.key
        #         path: server.key
        #     defaultMode: 420
        - name: nginx-config
          configMap:
            name: {{ include "isd-wiki.fullname" . }}-nginx-config
            # defaultMode: 0644
        - name: nginx-cache
          emptyDir: {}
        - name: mediawiki-data
          persistentVolumeClaim:
            claimName: {{ include "isd-wiki.fullname" . }}-data
        - name: mediawiki-html-volume
          persistentVolumeClaim:
            claimName: {{ include "isd-wiki.fullname" . }}-html
      {{- with .Values.mediawiki.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mediawiki.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mediawiki.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}