apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "isd-wiki.fullname" . }}-data
  labels:
    {{- include "isd-wiki.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ dig "persistence" "data" "size" "2Gi" .Values.mediawiki }}
