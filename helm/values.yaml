# Default values for mediawiki.

# Global configuration
global:
  nameOverride: ""
  fullnameOverride: ""
  licenseplate: "abcdef"
  cluster: "silver"
  serviceAccount:
    name: "abcdef-vault"
    # Specifies whether a service account should be created
    create: false
    # Automatically mount a ServiceAccount's API credentials?
    automount: true
  # Inject Keycloak JSON multi-value config from a Vault secret
  # See details: https://digital.gov.bc.ca/technology/cloud/private/products-tools/vault/
  vault:
    # Vault role for this service
    role: "abcdef-nonprod" 
    # Secrets path in container
    secret: "secrets-name"
    # Vault engine to use
    engine: "nonprod"

# Configuration for the NGINX sidecar container
nginx:
  image:
    repository: ghcr.io/bcgov/isd-wiki-proxy
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "latest"
  
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

# Configuration for the MediaWiki application
mediawiki:

  replicaCount: 1

  image:
    repository: ghcr.io/bcgov/isd-wiki
    pullPolicy: Always
    # Overrides the image tag whose default is the chart appVersion.
    tag: "latest"

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  siteServer: "https://mediawiki.example.com"

# These values would come from the Dockerfile's ENV variables
  # or from the official MediaWiki Docker image documentation.
  # For now, let's assume direct configuration.
  # the'll likely map these to environment variables in the deployment.yaml
  database:
    secretName: "patroni-isd-wiki-db"
    type: postgres
    host: "patroni-isd-wiki-db"
    port: 5432
    name: mediawiki
    user: mediawiki
    # password: ""
    # rootPassword: ""

  # Configuration for LocalSettings.php
  siteName: "MediaWiki"
  adminUser: "admin"
  adminPassword: "" # Set this securely
  # Add more MediaWiki-specific settings here, which the can inject into LocalSettings.php

  smtp:
    host: "mail.example.com"
    idHost: "example.com"
    localhost: "example.com"
    port: 25
    auth: false

  serviceAccount:
    # Specifies whether a service account should be created
    create: false
    # Automatically mount a ServiceAccount's API credentials?
    automount: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  podAnnotations: {}

  podLabels: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  # Resources for the mediawiki (php-fpm) container.
  #
  # Leaving this empty does NOT mean "unconstrained" - the deployment template
  # substitutes sane defaults when it is empty (see the comment there). Set it
  # here to override them wholesale.
  #
  # The defaults are requests cpu 100m / memory 768Mi and a 4Gi memory limit,
  # sized against observed usage plus pm.max_children workers. Raising
  # pm.max_children in php-fpm-pool.conf or PHP's memory_limit should be
  # revisited together with these numbers.
  resources: {}

  # Persistent volume sizing.
  persistence:
    html:
      # The RWX volume holding the MediaWiki tree, LocalSettings.php and user
      # uploads (images/). The initContainer copies the whole application into
      # it on every pod start, so most of it is code rather than content -
      # which leaves proportionally little headroom for uploads. At 1Gi prod
      # was already 74% full with only ~265Mi free, so uploads were on track to
      # fill it. netapp-file-standard has allowVolumeExpansion=true, so growing
      # this is an online operation on the existing volume; note that CSI
      # expansion is one-way, this value can be raised later but never lowered.
      size: 5Gi
    data:
      # Mounted at /var/www/data. Currently unused - it is empty in both test
      # and prod - and being ReadWriteOnce it pins every pod to a single node.
      # Left as-is here; removing it belongs with the multi-replica work.
      size: 2Gi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  # Additional volumes on the output Deployment definition.
  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  # Additional volumeMounts on the output Deployment definition.
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

  nodeSelector: {}

  tolerations: []

  affinity: {}

