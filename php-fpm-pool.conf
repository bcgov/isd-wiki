; ISD Wiki php-fpm pool tuning.
;
; The upstream php-fpm image ships pm.max_children = 5, which caps the wiki at
; five concurrent PHP requests no matter how much CPU or memory the pod has.
; Beyond that, requests sit in the fpm listen backlog and eventually time out
; at the gateway, which looks to users like the wiki hanging rather than being
; busy.
;
; php-fpm.conf glob-includes /usr/local/etc/php-fpm.d/*.conf in alphabetical
; order, so this file is named to sort after both www.conf and zz-docker.conf.
; It re-opens the existing [www] pool and overrides only the process-manager
; settings; listen, user and group are left to www.conf.

[www]
pm = dynamic

; Worst-case memory is pm.max_children * PHP memory_limit (128M), but a typical
; MediaWiki page render peaks well below that, and the pod currently idles at
; ~200Mi across both containers. 16 is a deliberately moderate step up from 5:
; it removes the immediate concurrency ceiling while staying modest until the
; mediawiki container has memory requests and limits set (it is currently
; BestEffort, so it is the first thing evicted under node memory pressure).
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; Recycle workers periodically so a slow leak in any one long-lived worker
; cannot accumulate indefinitely.
pm.max_requests = 500

; --- Upload limits ---
; The stock php.ini ships upload_max_filesize = 2M and post_max_size = 8M, both
; below $wgMaxUploadSize (10M, set in LocalSettings.php). PHP enforces its own
; limits before MediaWiki sees the request, so the wiki's configured 10M was
; never reachable: a 3MB docx was dropped by PHP with UPLOAD_ERR_INI_SIZE and
; surfaced to the user as an empty or failed upload rather than a size error.
;
; These are php_admin_value rather than php_value so they cannot be overridden
; per-request by ini_set(). Both are PHP_INI_PERDIR settings, which is why they
; are set here in the fpm pool rather than at runtime.
;
; Ordering is deliberate and matches the comment in the nginx configmap:
;   $wgMaxUploadSize    10M  <- what ordinary users get, and are shown
;   (raised per-request)  50M  <- users holding the 'upload-large' right
;   upload_max_filesize   50M
;   post_max_size         52M  (must be >= upload_max_filesize; also covers the
;                               multipart form overhead around the file itself)
;   client_max_body_size  52m  (helm/templates/nginx-configmap.yaml)
;
; php-fpm cannot see which user is uploading, so these carry the 50M ceiling for
; everyone. LocalSettings.php is what holds other users to 10M, via a hook that
; raises $wgMaxUploadSize per request - see the upload-large block appended by
; docker-entrypoint.sh.
; Each layer sits above the one before it so that MediaWiki produces the error
; message, with a limit it knows about, instead of nginx returning a bare 413 or
; PHP silently discarding the file. Raise these only together, in that order.
php_admin_value[upload_max_filesize] = 50M
php_admin_value[post_max_size] = 52M
