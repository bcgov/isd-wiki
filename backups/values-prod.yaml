backupConfig: |
  postgres=patroni-isd-wiki-db-prod:5432/app
  /mediawiki-data:dir
  /mediawiki-html:dir

  # Database and file backup at 1 AM
  0 1 * * * default ./backup.sh -s

  # Database and file verification at 2 AM
  0 2 * * * default ./backup.sh -s -v all

db:
  passwordKey: superuser-password
  secretName: patroni-isd-wiki-db-prod-secret
  usernameKey: superuser-username

env:
  BACKUP_STRATEGY:
    value: rolling
  DAILY_BACKUPS:
    value: "12"
  DATABASE_NAME:
    value: app
  DATABASE_SERVICE_NAME:
    value: patroni-isd-wiki-db-prod
  ENVIRONMENT_FRIENDLY_NAME:
    value: MediaWiki Backup (PROD)
  MONTHLY_BACKUPS:
    value: "2"
  WEEKLY_BACKUPS:
    value: "8"

image:
  repository: ghcr.io/bcgov/backup-container
  tag: latest

persistence:
  backup:
    size: 8Gi
    storageAccessMode: ReadWriteMany
    storageClassName: netapp-file-backup
  verification:
    size: 2Gi
    storageClassName: netapp-file-standard

# Mount MediaWiki PVCs from prod namespace
volumes:
  - name: mediawiki-data
    persistentVolumeClaim:
      claimName: isd-wiki-data-prod
  - name: mediawiki-html
    persistentVolumeClaim:
      claimName: isd-wiki-html-prod

volumeMounts:
  - name: mediawiki-data
    mountPath: /mediawiki-data
    readOnly: true
  - name: mediawiki-html
    mountPath: /mediawiki-html
    readOnly: true
